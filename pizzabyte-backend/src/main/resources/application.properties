# ==============================================================================
# PIZZABYTE v3.0 - CONFIGURACIÓN SPRING BOOT & POSTGRESQL 18
# ==============================================================================

spring.application.name=pizzabyte-backend
server.port=8080
server.address=0.0.0.0

# 1. Configuración del DataSource JDBC para PostgreSQL 18
spring.datasource.url=jdbc:postgresql://localhost:5432/pizzabyte_db?currentSchema=pizzabyte_core
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Configuración de Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=pizzabyte_core

# 3. Formato JSON de Respuestas HTTP (SNAKE_CASE para compatibilidad con REST y Angular)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Mexico_City

# 4. Logs
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
